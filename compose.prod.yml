services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sportquest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sportquest
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportquest"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://sportquest:${POSTGRES_PASSWORD}@db:5432/sportquest
      SESSION_SECRET: ${SESSION_SECRET}
      UPLOAD_DIR: /data/uploads
      AUTH_DEBUG: ${AUTH_DEBUG:-}
      SEED_SAMPLES: ${SEED_SAMPLES:-0}
      PUBLIC_URL: https://${DOMAIN}
      TELEGRAM_CLIENT_ID: ${TELEGRAM_CLIENT_ID:-}
      TELEGRAM_CLIENT_SECRET: ${TELEGRAM_CLIENT_SECRET:-}
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

  # One-off tooling (migrations, seed) from the full build stage:
  #   docker compose -f compose.prod.yml --env-file .env.prod run --rm tools npx prisma migrate deploy
  #   docker compose -f compose.prod.yml --env-file .env.prod run --rm tools npx tsx prisma/seed.ts
  tools:
    build:
      context: .
      target: build
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://sportquest:${POSTGRES_PASSWORD}@db:5432/sportquest
      SEED_SAMPLES: ${SEED_SAMPLES:-0}
      PUBLIC_URL: https://${DOMAIN}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      SERVER_IP: ${SERVER_IP}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:

services:
  # Dedicated RU1 → US1 path. No host publication: only this Compose network
  # can reach the proxy. Its only outbound is US1, with no direct fallback.
  xray:
    image: sport-quest-xray:26.10.21
    build:
      context: ./infra/xray
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:mode=1777,size=16m
    environment:
      XRAY_US_ADDRESS: ${XRAY_US_ADDRESS:?Set XRAY_US_ADDRESS}
      XRAY_US_PORT: ${XRAY_US_PORT:-443}
      XRAY_CLIENT_UUID: ${XRAY_CLIENT_UUID:?Set XRAY_CLIENT_UUID}
      XRAY_REALITY_PUBLIC_KEY: ${XRAY_REALITY_PUBLIC_KEY:?Set XRAY_REALITY_PUBLIC_KEY}
      XRAY_REALITY_SHORT_ID: ${XRAY_REALITY_SHORT_ID:?Set XRAY_REALITY_SHORT_ID}
      XRAY_REALITY_SERVER_NAME: ${XRAY_REALITY_SERVER_NAME:-www.microsoft.com}
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS --connect-timeout 5 --max-time 12 --proxy http://127.0.0.1:18080 https://oauth.telegram.org/.well-known/jwks.json >/dev/null']
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sportquest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sportquest
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportquest"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: ghcr.io/roman-kutimskii/sport-quest:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://sportquest:${POSTGRES_PASSWORD}@db:5432/sportquest
      SESSION_SECRET: ${SESSION_SECRET}
      UPLOAD_DIR: /data/uploads
      AUTH_DEBUG: ${AUTH_DEBUG:-}
      SEED_SAMPLES: ${SEED_SAMPLES:-0}
      PUBLIC_URL: https://${DOMAIN}
      TELEGRAM_CLIENT_ID: ${TELEGRAM_CLIENT_ID:-}
      TELEGRAM_CLIENT_SECRET: ${TELEGRAM_CLIENT_SECRET:-}
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
      TELEGRAM_ADMIN_USERNAMES: ${TELEGRAM_ADMIN_USERNAMES:-}
      BOT_MODE: ${BOT_MODE:-off}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      xray:
        condition: service_started
    expose:
      - "3000"
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000/api/health", {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Telegram group bot: long-polls Telegram through the proxy, files reports via the LLM,
  # announces website reports and posts the weekly digest. Runs on the tools image (full source).
  bot:
    image: ghcr.io/roman-kutimskii/sport-quest:${IMAGE_TAG:-latest}-tools
    restart: unless-stopped
    # The receive loop long-polls for up to 30 s; give it time to finish before SIGKILL.
    stop_grace_period: 50s
    command: npx tsx scripts/bot.ts
    environment:
      DATABASE_URL: postgresql://sportquest:${POSTGRES_PASSWORD}@db:5432/sportquest
      UPLOAD_DIR: /data/uploads
      PUBLIC_URL: https://${DOMAIN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_GROUP_CHAT_ID: ${TELEGRAM_GROUP_CHAT_ID:-}
      TELEGRAM_GROUP_THREAD_ID: ${TELEGRAM_GROUP_THREAD_ID:-}
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.8-flash-high}
      BOT_MODE: ${BOT_MODE:-off}
      DIGEST_WEEKDAY: ${DIGEST_WEEKDAY:-0}
      DIGEST_HOUR: ${DIGEST_HOUR:-20}
      DIGEST_LLM_COMMENT: ${DIGEST_LLM_COMMENT:-0}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      xray:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, --import, tsx, scripts/bot-healthcheck.ts]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # One-off tooling (migrations, seed) from the full build stage:
  #   docker compose -f compose.prod.yml --env-file .env.prod run --rm tools npx prisma migrate deploy
  #   docker compose -f compose.prod.yml --env-file .env.prod run --rm tools npx tsx prisma/seed.ts
  tools:
    image: ghcr.io/roman-kutimskii/sport-quest:${IMAGE_TAG:-latest}-tools
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://sportquest:${POSTGRES_PASSWORD}@db:5432/sportquest
      SEED_SAMPLES: ${SEED_SAMPLES:-0}
      PUBLIC_URL: https://${DOMAIN}
      UPLOAD_DIR: /data/uploads
      # bot:restore / bot:import talk to Telegram, and only through the proxy: without these the
      # token is empty and the direct api.telegram.org call fails.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_GROUP_CHAT_ID: ${TELEGRAM_GROUP_CHAT_ID:-}
      TELEGRAM_GROUP_THREAD_ID: ${TELEGRAM_GROUP_THREAD_ID:-}
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
      BOT_MODE: ${BOT_MODE:-off}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      xray:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      SERVER_IP: ${SERVER_IP}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
